{% comment %}The outgoing-call modal and the incoming-call toast. Split out so a
page that embeds a thread gets the call affordances the Messages page has.{% endcomment %}
<div class="modal fade" id="callModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content text-center">
      <div class="modal-body p-4">
        <div class="ring-ava mx-auto mb-3"><i class="bi" id="callModalIcon"></i></div>
        <h6 class="mb-1" id="callModalTitle">Calling…</h6>
        <p class="text-muted small mb-3" id="callModalSub">Connecting you to the meeting room</p>
        <div class="d-flex gap-2 justify-content-center">
          <a class="btn btn-success btn-sm" href="{% url 'communication:meetings' %}"><i class="bi bi-telephone-fill me-1"></i>Join room</a>
          <button type="button" class="btn btn-danger btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-lg me-1"></i>Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="incomingCall" class="card shadow-lg border-0">
  <div class="card-body d-flex align-items-center gap-3">
    <div class="ring-ava"><i class="bi bi-camera-video-fill"></i></div>
    <div class="min-w-0 flex-grow-1">
      <strong class="d-block text-truncate" id="incomingTitle">Incoming call</strong>
      <small class="text-muted">Meeting is live now</small>
    </div>
    <div class="d-flex flex-column gap-1">
      <a class="btn btn-success btn-sm py-0" id="incomingJoin" href="#"><i class="bi bi-telephone-fill"></i></a>
      <button class="btn btn-danger btn-sm py-0" id="incomingDismiss"><i class="bi bi-telephone-x"></i></button>
    </div>
  </div>
</div>
