{% comment %}The messenger's look, shared by the Messages page and by any page
that embeds a thread (a module feed's Messages tab). One copy, so an embedded
chat is not "similar to" the real one — it is the same component.{% endcomment %}
<style>
  .msgr{ display:flex; gap:0; height:calc(100vh - 190px); min-height:460px; }
  .msgr-list{ width:320px; flex:0 0 320px; border:1px solid var(--bs-border-color,#e6e8ee); border-radius:12px 0 0 12px; display:flex; flex-direction:column; background:#fff; }
  .msgr-thread{ flex:1; border:1px solid var(--bs-border-color,#e6e8ee); border-left:0; border-radius:0 12px 12px 0; display:flex; flex-direction:column; min-width:0; background:#fff; }
  .msgr-list .head, .msgr-thread .head{ padding:14px 16px; border-bottom:1px solid #eef0f3; }
  .msgr-convos{ overflow-y:auto; flex:1; }
  .convo{ display:flex; gap:10px; align-items:center; padding:11px 14px; border-bottom:1px solid #f3f4f6; text-decoration:none; color:inherit; }
  .convo:hover{ background:#f8f9fb; } .convo.active{ background:#eaf2ff; }

  /* --- Avatars: the person's photo, with their initials only as a fallback --- */
  .ava{ position:relative; flex:0 0 auto; border-radius:50%; overflow:hidden; display:inline-flex;
        align-items:center; justify-content:center; font-weight:700; color:#fff; background:#6c8cff;
        text-transform:uppercase; letter-spacing:.02em; }
  .ava img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ava-42{ width:42px;height:42px;font-size:.9rem; }
  .ava-36{ width:36px;height:36px;font-size:.78rem; }
  .ava-28{ width:28px;height:28px;font-size:.66rem; }
  .ava-group{ background:#8a94a6; }
  .convo .ava{ transition:box-shadow .2s ease; }
  /* Unread: blue ring around the avatar */
  .convo.has-unread .ava{ box-shadow:0 0 0 3px #0d6efd, 0 0 0 5px rgba(13,110,253,.2); }
  .convo.has-unread .conv-name{ font-weight:700; }
  /* New message: green bubble/dot next to the name */
  .new-dot{ display:inline-flex;align-items:center;gap:4px;background:#19c37d;color:#fff;font-size:.62rem;font-weight:700;
    padding:1px 7px;border-radius:999px;line-height:1.4; box-shadow:0 0 0 3px rgba(25,195,125,.15); }
  .new-dot .g-pulse{ width:6px;height:6px;border-radius:50%;background:#fff;animation:gpulse 1s ease infinite; }
  @keyframes gpulse{ 0%,100%{opacity:.5} 50%{opacity:1} }
  .min-w-0{ min-width:0; }

  /* --- Thread header: you · chat icon · who you're talking to --- */
  .thread-who{ display:flex; align-items:center; gap:8px; min-width:0; }
  .thread-who .name{ font-weight:600; line-height:1.15; }
  .thread-who .sub{ font-size:.72rem; color:#9aa0a6; }
  .thread-link{ color:#0d6efd; font-size:1.05rem; flex:0 0 auto; }
  .peer-stack{ display:flex; }
  .peer-stack .ava + .ava{ margin-left:-10px; box-shadow:0 0 0 2px #fff; }

  /* --- Messages --- */
  .msgr-msgs{ flex:1; overflow-y:auto; padding:16px; background:#f7f8fa; position:relative; }
  /* Day divider — a small pill that floats over the thread as you scroll. */
  .day-sep{ position:sticky; top:0; z-index:3; text-align:center; margin:6px 0 14px; pointer-events:none; }
  .day-sep span{ display:inline-block; background:rgba(33,37,41,.72); color:#fff; font-size:.68rem; font-weight:600;
    letter-spacing:.02em; padding:3px 12px; border-radius:999px; backdrop-filter:blur(4px); box-shadow:0 2px 6px rgba(0,0,0,.12); }

  .msg{ display:flex; gap:8px; align-items:flex-end; margin-bottom:3px; }
  .msg.me{ flex-direction:row-reverse; }
  /* First message of a run carries the name/time line and the extra gap. */
  .msg.run-start{ margin-top:14px; }
  .msg .ava-slot{ width:28px; flex:0 0 28px; }
  .msg .col{ min-width:0; max-width:78%; display:flex; flex-direction:column; }
  .msg.me .col{ align-items:flex-end; }
  .msg .meta{ font-size:.72rem; color:#9aa0a6; margin-bottom:3px; padding:0 4px; }
  .msg .bubble{ padding:8px 12px; border-radius:14px; background:#fff; color:#212529;
    box-shadow:0 1px 2px rgba(0,0,0,.06); white-space:pre-wrap; word-break:break-word; }
  /* Mine dark grey, everyone else's white. */
  .msg.me .bubble{ background:#3f4550; color:#fff; }
  .msg.me .bubble a{ color:#cfe2ff; }
  .msg .bubble .media-grid{ max-width:280px; }
  /* Tail-shaping so a run of bubbles reads as one block. */
  .msg:not(.run-start) .bubble{ border-top-left-radius:6px; }
  .msg.me:not(.run-start) .bubble{ border-top-left-radius:14px; border-top-right-radius:6px; }

  /* Quoted message above a reply */
  .quote{ border-left:3px solid #0d6efd; background:rgba(13,110,253,.07); border-radius:6px;
    padding:4px 8px; margin-bottom:5px; font-size:.78rem; line-height:1.3; cursor:pointer; }
  .msg.me .quote{ background:rgba(255,255,255,.14); border-left-color:#9ec5fe; }
  .quote .q-who{ font-weight:700; display:block; }
  .quote .q-body{ opacity:.8; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Per-message actions (reply / edit), revealed on hover */
  .msg-acts{ display:flex; gap:2px; align-self:center; opacity:0; transition:opacity .15s ease; flex:0 0 auto; }
  .msg:hover .msg-acts, .msg:focus-within .msg-acts{ opacity:1; }
  .msg-acts button{ border:0; background:transparent; color:#8a94a6; padding:2px 5px; border-radius:6px; font-size:.86rem; line-height:1; }
  .msg-acts button:hover{ background:#e9ecef; color:#0d6efd; }

  /* Read ticks */
  .ticks{ font-size:.7rem; margin-left:5px; }
  .ticks.read{ color:#4dabf7; }
  .msg .stamp{ font-size:.66rem; color:#9aa0a6; margin-top:2px; padding:0 4px; }
  .msg.me .stamp{ text-align:right; }
  /* A message someone jumped to from a quote, flashed so it can be found. */
  @keyframes flashmsg{ 0%,100%{ background:transparent } 30%{ background:rgba(13,110,253,.14) } }
  .msg.flash{ animation:flashmsg 1.4s ease; border-radius:10px; }

  /* Compose bar: reuse the .mediazone drop behaviour but flat (no dashed box). */
  .msgr-compose.mz-chat{ display:block;padding:10px 12px;border-top:1px solid #eef0f3;border-radius:0;border:0;border-top:1px solid #eef0f3;background:#fff;cursor:default; }
  .msgr-compose.mz-chat.dragging{ background:#eef4ff;box-shadow:inset 0 0 0 2px #0d6efd; }
  .msgr-compose.mz-chat .mediazone-preview{ margin-bottom:8px; }
  .mz-chat-row{ display:flex;gap:8px;align-items:flex-end; }
  .mz-chat-actions{ display:flex;gap:4px; }
  .mz-chat-actions .mz-act{ width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem; }
  .msgr-compose textarea{ flex:1;resize:none; }
  /* "Replying to…" strip above the composer */
  #replyBar{ display:none; align-items:center; gap:8px; background:#f1f5ff; border-left:3px solid #0d6efd;
    border-radius:6px; padding:6px 10px; margin-bottom:8px; font-size:.8rem; }
  #replyBar.show{ display:flex; }
  #replyBar .r-body{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#5c6470; }

  /* Call buttons in the thread header */
  .call-btn{ width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center; }
  /* Typing indicator */
  .typing-bar{ display:none;align-items:center;gap:8px;padding:6px 16px;border-top:1px solid #eef0f3;color:#6c757d;font-size:.82rem; }
  .typing-bar.show{ display:flex; }
  .typing-dots{ display:inline-flex;gap:3px; }
  .typing-dots span{ width:6px;height:6px;border-radius:50%;background:#0d6efd;opacity:.4;animation:typing 1.2s infinite; }
  .typing-dots span:nth-child(2){ animation-delay:.2s } .typing-dots span:nth-child(3){ animation-delay:.4s }
  @keyframes typing{ 0%,60%,100%{ transform:translateY(0);opacity:.4 } 30%{ transform:translateY(-4px);opacity:1 } }
  /* Incoming call toast */
  #incomingCall{ position:fixed; top:80px; right:20px; z-index:1080; width:300px; display:none; }
  #incomingCall.show{ display:block; }
  .ring-ava{ width:46px;height:46px;border-radius:50%;background:#0d6efd;color:#fff;display:flex;align-items:center;justify-content:center;
    animation:ringpulse 1s ease infinite; }
  @keyframes ringpulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(13,110,253,.4) } 50%{ box-shadow:0 0 0 10px rgba(13,110,253,0) } }
  @media (max-width:820px){ .msgr{ flex-direction:column;height:auto } .msgr-list{ width:100%;flex:none;border-radius:12px } .msgr-thread{ border-left:1px solid #e6e8ee;border-radius:12px;margin-top:12px } .msg .col{ max-width:88%; } }
</style>
