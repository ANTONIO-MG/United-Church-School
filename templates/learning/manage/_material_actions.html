{% comment %}The per-row buttons on the builder: open it, list it in the shop,
remove it. Split out because block-level and week-level rows both need it.
Context: m = ModuleMaterial (offering comes from the page).{% endcomment %}
<div class="d-flex gap-1 flex-shrink-0">
  {% if m.target_url %}
  <a class="btn btn-sm btn-outline-secondary mb-0 py-0 px-2" href="{% url 'learning:material-open' m.pk %}"
     target="_blank" rel="noopener" title="Open"><i class="bi bi-box-arrow-up-right"></i></a>
  {% endif %}

  <form method="post" action="{% url 'learning:module-material-publish' offering.pk m.pk %}"
        class="d-flex gap-1">{% csrf_token %}
    <input type="number" step="0.01" min="0" name="price" class="form-control form-control-sm py-0 px-1"
           style="width:80px" value="{{ m.product.price|default:'0'|floatformat:2 }}"
           title="Shop price for this item on its own">
    <button class="btn btn-sm btn-outline-info mb-0 py-0 px-2"
            title="{% if m.is_purchasable %}Update the shop listing{% else %}List this in the shop{% endif %}">
      <i class="bi bi-bag{% if m.is_purchasable %}-check{% endif %}"></i></button>
  </form>

  <form method="post" action="{% url 'learning:module-material-delete' offering.pk m.pk %}"
        onsubmit="return confirm('Remove {{ m.title|escapejs }}?');">{% csrf_token %}
    <button class="btn btn-sm btn-outline-danger mb-0 py-0 px-2"><i class="bi bi-trash"></i></button>
  </form>
</div>
